name: windows

# Windows build and unit tests (MSVC, vcpkg's ICU and OpenSSL). Separate
# from ci.yml, which holds the Linux jobs.
on:
  push:
    branches: [main]
    paths:
      - "CMakeLists.txt"
      - "cmake/**"
      - "include/**"
      - "src/**"
      - "testing/**"
      - "tests/**"
      - "fuzz/**"
      - "examples/**"
      - ".github/workflows/windows.yml"
      - ".github/vcpkg/**"
      - ".github/badges.py"
      - ".github/publish_badges.sh"
  pull_request:
    paths:
      - "CMakeLists.txt"
      - "cmake/**"
      - "include/**"
      - "src/**"
      - "testing/**"
      - "tests/**"
      - "fuzz/**"
      - "examples/**"
      - ".github/workflows/windows.yml"
      - ".github/vcpkg/**"
      - ".github/badges.py"
      - ".github/publish_badges.sh"
  workflow_dispatch:

# A newer push to a PR cancels the older run; runs on main all finish, so
# their caches are saved.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # .github/vcpkg: the manifest (ICU, OpenSSL, and the vcpkg commit as its
  # builtin-baseline) and a release-only triplet.
  VCPKG_MANIFEST: .github\vcpkg
  VCPKG_TRIPLET: x64-windows-release
  # vcpkg is cloned at the baseline commit, not the runner image's
  # (updated weekly, which would change every package's ABI hash).
  VCPKG_ROOT: ${{ github.workspace }}\.vcpkg
  VCPKG_INSTALLED: ${{ github.workspace }}\.vcpkg-installed
  # vcpkg's binary cache, kept with actions/cache below.
  VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}\vcpkg-bincache,readwrite
  # Capy, Corosio and Catch2 are fetched here, outside the build dir, so
  # their sources can be cached.
  FETCHCONTENT_BASE_DIR: ${{ github.workspace }}\.deps

jobs:
  msvc:
    name: MSVC Debug
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      # The x64 developer environment (cl, link, ninja, the Windows SDK) for
      # the steps below, but not its VCPKG_ROOT (Visual Studio's own vcpkg),
      # which would replace the pinned clone's.
      - name: MSVC environment
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $vars = cmd /c "`"$vs\VC\Auxiliary\Build\vcvars64.bat`" >nul && set"
          foreach ($line in $vars) {
            if ($line -match '^([^=]+)=(.*)$' -and $Matches[1] -ne 'VCPKG_ROOT') {
              "$($Matches[1])=$($Matches[2])" >> $env:GITHUB_ENV
            }
          }

      - name: Toolchain versions
        run: |
          "MSVC tools $env:VCToolsVersion"
          cmake --version
          ninja --version

      - name: Clone vcpkg at the manifest's baseline
        run: |
          $commit = (Get-Content "$env:VCPKG_MANIFEST\vcpkg.json" | ConvertFrom-Json).'builtin-baseline'
          git init -q "$env:VCPKG_ROOT"
          git -C "$env:VCPKG_ROOT" fetch -q --depth 1 https://github.com/microsoft/vcpkg.git $commit
          git -C "$env:VCPKG_ROOT" checkout -q FETCH_HEAD
          & "$env:VCPKG_ROOT\bootstrap-vcpkg.bat" -disableMetrics
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Restored and saved in separate steps, so a red build or test still
      # saves them. The key names the manifest and triplet and the MSVC
      # tools (part of each package's ABI hash); when one of them changed,
      # an older cache is restored and the new packages are added to it.
      - name: Restore vcpkg's binary cache
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: vcpkg-bincache
          key: vcpkg-${{ runner.os }}-${{ env.VCPKG_TRIPLET }}-${{ hashFiles('.github/vcpkg/**') }}-${{ env.VCToolsVersion }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ env.VCPKG_TRIPLET }}-${{ hashFiles('.github/vcpkg/**') }}-
            vcpkg-${{ runner.os }}-${{ env.VCPKG_TRIPLET }}-

      - name: Restore the FetchContent sources
        id: deps-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            .deps/*-src
            .deps/*-subbuild
          key: fetchcontent-${{ hashFiles('CMakeLists.txt', 'tests/CMakeLists.txt') }}

      - name: Install ICU and OpenSSL
        id: install
        run: |
          New-Item -ItemType Directory -Force vcpkg-bincache | Out-Null
          & "$env:VCPKG_ROOT\vcpkg.exe" install --x-manifest-root="$env:VCPKG_MANIFEST" `
            --overlay-triplets="$env:VCPKG_MANIFEST\triplets" --triplet $env:VCPKG_TRIPLET `
            --x-install-root="$env:VCPKG_INSTALLED"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Also when the install failed part way: what it built is kept.
      - name: Save vcpkg's binary cache
        if: ${{ !cancelled() && (steps.install.outcome == 'success' || steps.install.outcome == 'failure') && steps.vcpkg-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: vcpkg-bincache
          key: vcpkg-${{ runner.os }}-${{ env.VCPKG_TRIPLET }}-${{ hashFiles('.github/vcpkg/**') }}-${{ env.VCToolsVersion }}

      # Debug without the checked iterators (_ITERATOR_DEBUG_LEVEL=2 makes
      # every container allocate a proxy from its allocator, which the
      # allocation-counting tests count), still with the debug CRT and
      # asserts. Set through CXXFLAGS, so CMake keeps its default flags;
      # Capy, Corosio and Catch2 get it too (ICU and OpenSSL are DLLs).
      - name: Configure
        env:
          CXXFLAGS: /D_ITERATOR_DEBUG_LEVEL=0
        run: >
          cmake -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT\scripts\buildsystems\vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET="$env:VCPKG_TRIPLET"
          -DVCPKG_MANIFEST_MODE=OFF
          -DVCPKG_INSTALLED_DIR="$env:VCPKG_INSTALLED"
          -DFETCHCONTENT_BASE_DIR="$env:FETCHCONTENT_BASE_DIR"
          -DJHETZ_LDAP_BUILD_TESTS=ON
          -DJHETZ_LDAP_BUILD_FUZZERS=OFF
          -DJHETZ_LDAP_BUILD_BENCH=OFF
          -DJHETZ_LDAP_WITH_GSSAPI=OFF

      - name: Save the FetchContent sources
        if: ${{ steps.deps-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: |
            .deps/*-src
            .deps/*-subbuild
          key: fetchcontent-${{ hashFiles('CMakeLists.txt', 'tests/CMakeLists.txt') }}

      - name: Build
        # -k 0: every failing file in one run.
        run: cmake --build build -- -k 0

      # No slapd, Samba or KDC on Windows: the integration tests are left out.
      # The ICU and OpenSSL DLLs from PATH: vcpkg's toolchain copies a Debug
      # build's from debug\bin, which the release-only triplet does not have.
      # A failing test still gets its badge; the last step fails the job.
      - name: Test
        id: test
        run: |
          $env:PATH = "$env:VCPKG_INSTALLED\$env:VCPKG_TRIPLET\bin;$env:PATH"
          ctest --test-dir build --output-on-failure -j4 -LE integration --timeout 600 2>&1 | Tee-Object ctest.log
          "status=$LASTEXITCODE" >> $env:GITHUB_OUTPUT
          exit 0

      - name: Badge file
        if: ${{ !cancelled() }}
        run: python .github/badges.py tests "windows tests" ctest.log badges/tests-windows.json >> $env:GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: badges-windows
          path: badges/

      - name: Fail on test failures
        if: ${{ steps.test.outputs.status != '0' }}
        run: exit 1

  # Publishes tests-windows.json to the branch badges, next to ci.yml's
  # files, which it leaves alone; pushed without force, retried on top of
  # ci.yml's commit (.github/publish_badges.sh). Only on pushes to main,
  # never for pull requests; the only job with write access.
  badges:
    name: Publish badges
    needs: msvc
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: badges-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: .github
      - uses: actions/download-artifact@v5
        with:
          name: badges-windows
          path: badges
      - name: Push to the badges branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/publish_badges.sh badges tests-windows.json
