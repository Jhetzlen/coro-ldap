name: ldap

on:
  # Branch pushes are covered by their pull request; only run on push for the
  # main branches, so a PR branch is not built twice.
  push:
    branches: [master, main]
    paths:
      - "CMakeLists.txt"
      - "cmake/**"
      - "include/**"
      - "src/**"
      - "tests/**"
      - "fuzz/**"
      - "examples/**"
      - "bench/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "CMakeLists.txt"
      - "cmake/**"
      - "include/**"
      - "src/**"
      - "tests/**"
      - "fuzz/**"
      - "examples/**"
      - "bench/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

# A newer push to the same branch or PR cancels the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # UBSan findings abort (the build also uses -fno-sanitize-recover=all).
  UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
  DEBIAN_FRONTEND: noninteractive

# Toolchain: the project needs GCC 16 / Clang 23 with libstdc++ 16. The
# Ubuntu runner images ship at most GCC 15 / Clang 22, and the only GCC 16
# Ubuntu packages (ubuntu-toolchain-r/test for 24.04, the 26.04 archive) are
# pre-release snapshots from March 2026. So the Linux build jobs run in a
# debian:sid container, which has the released g++-16 (16.2), clang-23
# (23.1) and clang-format-23 in one archive, plus slapd. Clang uses the
# newest installed GCC's libstdc++, so the Clang jobs install g++-16 too.
# The sysctl gives the container an IPv6 loopback for the [::1] network
# tests (they skip without one).

jobs:
  # clang-format 23, from the same debian:sid container as the build jobs.
  format:
    name: clang-format 23
    runs-on: ubuntu-24.04
    container: debian:sid
    steps:
      - name: Install clang-format
        run: apt-get update && apt-get install -y git ca-certificates clang-format-23
      - uses: actions/checkout@v4
      - name: Check formatting
        run: find include src tests fuzz examples bench -name '*.cpp' -o -name '*.hpp' | xargs clang-format-23 --dry-run --Werror

  gcc-sanitize:
    name: GCC 16 Debug (ASan + UBSan)
    runs-on: ubuntu-24.04
    container:
      image: debian:sid
      options: --sysctl net.ipv6.conf.all.disable_ipv6=0
    steps:
      # libssl-dev, libicu-dev: jhetz::ldap_net (Corosio's OpenSSL backend;
      # ICU for SCRAM's SASLprep). Corosio and Capy are fetched from GitHub at
      # configure time (pinned commits), hence git.
      - name: Install tools
        run: apt-get update && apt-get install -y git ca-certificates cmake ninja-build g++-16 libssl-dev libicu-dev
      - uses: actions/checkout@v4
      - name: Configure
        run: >
          cmake -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_COMPILER=g++-16
          -DJHETZ_LDAP_SANITIZE=ON
          -DJHETZ_LDAP_WERROR=ON
      - name: Build
        run: cmake --build build
      # Includes the net.* tests: in-process TCP, TLS and Unix socket servers.
      - name: Test
        run: ctest --test-dir build --output-on-failure
      # The socket tests once more, a few times over, to catch flakiness.
      - name: Repeat network tests
        run: ctest --test-dir build --output-on-failure -R '^net\.' --repeat until-fail:5

  clang-net:
    name: Clang 23 Debug with NET (ASan + UBSan)
    runs-on: ubuntu-24.04
    container:
      image: debian:sid
      options: --sysctl net.ipv6.conf.all.disable_ipv6=0
    steps:
      # g++-16 for libstdc++ 16 (Clang uses the newest GCC installation's).
      - name: Install tools
        run: apt-get update && apt-get install -y git ca-certificates cmake ninja-build clang-23 g++-16 libssl-dev libicu-dev
      - uses: actions/checkout@v4
      - name: Configure
        run: >
          cmake -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_COMPILER=clang++-23
          -DJHETZ_LDAP_SANITIZE=ON
          -DJHETZ_LDAP_WERROR=ON
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure

  integration:
    name: Integration (OpenLDAP slapd, GCC 16, ASan + UBSan)
    runs-on: ubuntu-24.04
    container:
      image: debian:sid
      options: --sysctl net.ipv6.conf.all.disable_ipv6=0
    steps:
      # No systemd or AppArmor in the container: the packaged slapd is not
      # started, and the tests run their own from a temporary directory.
      # run_slapd.sh needs openssl (test PKI) and python3 (fixture).
      - name: Install tools and slapd
        run: |
          apt-get update
          echo 'slapd slapd/no_configuration boolean true' | debconf-set-selections
          apt-get install -y git ca-certificates cmake ninja-build g++-16 libssl-dev libicu-dev slapd openssl python3
      - uses: actions/checkout@v4
      - name: Configure
        run: >
          cmake -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_COMPILER=g++-16
          -DJHETZ_LDAP_SANITIZE=ON
          -DJHETZ_LDAP_WERROR=ON
      - name: Build
        run: cmake --build build --target jhetz_ldap_integration_tests
      # run_slapd.sh starts slapd (ldap, ldaps, ldapi, test PKI, fixture),
      # runs the command, and stops it.
      - name: Integration tests
        run: tests/integration/run_slapd.sh ctest --test-dir build -L integration --output-on-failure

  clang-fuzz:
    name: Clang 23 fuzz smoke test
    runs-on: ubuntu-24.04
    container: debian:sid
    steps:
      # libclang-rt-23-dev: libFuzzer and the sanitizer runtimes; g++-16 for
      # libstdc++ 16.
      - name: Install tools
        run: apt-get update && apt-get install -y git ca-certificates cmake ninja-build clang-23 libclang-rt-23-dev g++-16
      - uses: actions/checkout@v4
      # A fuzz build leaves jhetz::ldap_net off by default (the fuzzers only
      # cover the codec and URLs), so nothing is fetched here.
      - name: Configure
        run: >
          cmake -B build -G Ninja
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_CXX_COMPILER=clang++-23
          -DJHETZ_LDAP_BUILD_FUZZERS=ON
          -DJHETZ_LDAP_BUILD_TESTS=OFF
          -DJHETZ_LDAP_WERROR=ON
      - name: Build
        run: cmake --build build
      # ber_fuzz, message_fuzz, filter_fuzz, dn_fuzz, url_fuzz (every target in fuzz/CMakeLists.txt).
      - name: Run each fuzzer for 60 s
        run: |
          set -e
          for fuzzer in build/fuzzers/*; do
            name=$(basename "$fuzzer")
            mkdir -p "corpus/$name" "artifacts/$name"
            # Seed with the checked-in corpus (same seeds as <name>_replay).
            if [ -d "fuzz/corpus/$name" ]; then cp fuzz/corpus/$name/* "corpus/$name/"; fi
            # A dictionary, where there is one (fuzz/<name>.dict).
            dict=()
            if [ -f "fuzz/$name.dict" ]; then dict=(-dict="fuzz/$name.dict"); fi
            echo "::group::$name"
            "$fuzzer" -max_total_time=60 -print_final_stats=1 "${dict[@]}" \
              -artifact_prefix="artifacts/$name/" "corpus/$name"
            echo "::endgroup::"
          done
      - name: Upload crash inputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: artifacts/
