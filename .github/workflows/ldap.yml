name: ldap

on:
  # Branch pushes are covered by their pull request; only run on push for the
  # main branches, so a PR branch is not built twice.
  push:
    branches: [master, main]
    paths:
      - "ldap/**"
      - "examples/corosio/**"
      - ".github/workflows/ldap.yml"
  pull_request:
    paths:
      - "ldap/**"
      - "examples/corosio/**"
      - ".github/workflows/ldap.yml"

permissions:
  contents: read

env:
  # UBSan findings abort (the build also uses -fno-sanitize-recover=all).
  UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1

jobs:
  format:
    name: clang-format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format-18
      - name: Check formatting
        run: find ldap -name '*.cpp' -o -name '*.hpp' | xargs clang-format-18 --dry-run --Werror

  gcc-sanitize:
    name: GCC 13 Debug (ASan + UBSan)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # libssl-dev, libicu-dev: jhetz::ldap_net (Corosio's OpenSSL backend;
      # ICU for SCRAM's SASLprep). Corosio and Capy are fetched from GitHub at
      # configure time (pinned commits).
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build g++-13 libssl-dev libicu-dev
      - name: Configure
        run: >
          cmake -S ldap -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_COMPILER=g++-13
          -DJHETZ_LDAP_SANITIZE=ON
          -DJHETZ_LDAP_WERROR=ON
      - name: Build
        run: cmake --build build
      # Includes the net.* tests: in-process TCP, TLS and Unix socket servers.
      - name: Test
        run: ctest --test-dir build --output-on-failure
      # The socket tests once more, a few times over, to catch flakiness.
      - name: Repeat network tests
        run: ctest --test-dir build --output-on-failure -R '^net\.' --repeat until-fail:5

  clang-net:
    name: Clang 19 Debug with NET (ASan + UBSan)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang-19 libssl-dev libicu-dev
      - name: Configure
        run: >
          cmake -S ldap -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_COMPILER=clang++-19
          -DJHETZ_LDAP_SANITIZE=ON
          -DJHETZ_LDAP_WERROR=ON
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure

  # The standalone Corosio examples (examples/corosio): same pinned Corosio and
  # Capy commits as jhetz::ldap_net. Built only; the echo client needs a server.
  corosio-examples:
    name: Corosio examples (GCC 13)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build g++-13 libssl-dev
      - name: Configure
        run: >
          cmake -S examples/corosio -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_COMPILER=g++-13
          -DCOROSIO_EXAMPLES_WERROR=ON
      - name: Build
        run: cmake --build build
      # Runs entirely in-process (no server needed).
      - name: Run result_future example
        run: build/corosio_result_future

  # Not yet seen green: kept non-blocking until it is. Tests relying on Linux
  # loopback behaviour (127/8, SYN drop at a full backlog) skip themselves.
  macos:
    name: macOS (Apple Clang, NET)
    runs-on: macos-15
    continue-on-error: true
    env:
      # The default TMPDIR is too long for the ldapi:// tests' socket paths
      # (sockaddr_un holds 104 bytes on macOS).
      TMPDIR: /tmp
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: brew install ninja openssl@3 icu4c
      - name: Configure
        run: >
          cmake -S ldap -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DOPENSSL_ROOT_DIR="$(brew --prefix openssl@3)"
          -DICU_ROOT="$(brew --prefix icu4c)"
          -DJHETZ_LDAP_WERROR=ON
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure

  integration:
    name: Integration (OpenLDAP slapd, GCC 13, ASan + UBSan)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install tools and slapd
        run: |
          sudo apt-get update
          echo 'slapd slapd/no_configuration boolean true' | sudo debconf-set-selections
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y ninja-build g++-13 libssl-dev libicu-dev slapd
          # The tests run their own slapd from a temporary directory, which
          # the packaged AppArmor profile does not allow.
          sudo systemctl stop slapd || true
          if [ -e /etc/apparmor.d/usr.sbin.slapd ]; then sudo apparmor_parser -R /etc/apparmor.d/usr.sbin.slapd || true; fi
      - name: Configure
        run: >
          cmake -S ldap -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_COMPILER=g++-13
          -DJHETZ_LDAP_SANITIZE=ON
          -DJHETZ_LDAP_WERROR=ON
      - name: Build
        run: cmake --build build --target jhetz_ldap_integration_tests
      # run_slapd.sh starts slapd (ldap, ldaps, ldapi, test PKI, fixture),
      # runs the command, and stops it.
      - name: Integration tests
        run: ldap/tests/integration/run_slapd.sh ctest --test-dir build -L integration --output-on-failure

  clang-fuzz:
    name: Clang fuzz smoke test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang-18 libclang-rt-18-dev
      # A fuzz build leaves jhetz::ldap_net off by default (the fuzzers only
      # cover the codec and URLs), so nothing is fetched here.
      - name: Configure
        run: >
          cmake -S ldap -B build -G Ninja
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_CXX_COMPILER=clang++-18
          -DJHETZ_LDAP_BUILD_FUZZERS=ON
          -DJHETZ_LDAP_BUILD_TESTS=OFF
          -DJHETZ_LDAP_WERROR=ON
      - name: Build
        run: cmake --build build
      # ber_fuzz, message_fuzz, filter_fuzz, dn_fuzz, url_fuzz (every target in fuzz/CMakeLists.txt).
      - name: Run each fuzzer for 60 s
        run: |
          set -e
          for fuzzer in build/fuzzers/*; do
            name=$(basename "$fuzzer")
            mkdir -p "corpus/$name" "artifacts/$name"
            # Seed with the checked-in corpus (same seeds as <name>_replay).
            if [ -d "ldap/fuzz/corpus/$name" ]; then cp ldap/fuzz/corpus/$name/* "corpus/$name/"; fi
            # A dictionary, where there is one (fuzz/<name>.dict).
            dict=()
            if [ -f "ldap/fuzz/$name.dict" ]; then dict=(-dict="ldap/fuzz/$name.dict"); fi
            echo "::group::$name"
            "$fuzzer" -max_total_time=60 -print_final_stats=1 "${dict[@]}" \
              -artifact_prefix="artifacts/$name/" "corpus/$name"
            echo "::endgroup::"
          done
      - name: Upload crash inputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: artifacts/
